<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard | Study Dashboard</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- ===== 공통 Header / Navigation (모든 페이지 동일, active만 변경) ===== -->
  <nav class="navbar navbar-expand-lg sd-navbar">
    <div class="container-xl">
      <a class="navbar-brand" href="index.html"><span class="sd-brand-mark">2</span>Study Dashboard</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#sdNav"
              aria-controls="sdNav" aria-expanded="false" aria-label="메뉴 열기">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="sdNav">
        <ul class="navbar-nav ms-lg-3 gap-lg-1">
          <li class="nav-item"><a class="nav-link" href="index.html">Main</a></li>
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="dashboard.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="calendar.html">Calendar · Todo</a></li>
          <li class="nav-item"><a class="nav-link" href="planner.html">Planner</a></li>
          <li class="nav-item"><a class="nav-link" href="timer.html">Timer</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container-xl py-4">
    <header class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
      <div>
        <div class="sd-eyebrow" id="yearLabel">1월 1일부터</div>
        <h1 class="sd-page-title">Dashboard</h1>
        <p class="text-secondary mb-0 mt-1">과목마다 하루하루 얼마나 공부했는지 — GitHub 잔디처럼.</p>
      </div>
      <div class="d-grid gap-1 sd-source-pick">
        <span class="small text-secondary" id="sourceLabel">기준</span>
        <div class="btn-group btn-group-sm" role="group" aria-labelledby="sourceLabel">
          <input type="radio" class="btn-check" name="source" id="srcTimer" value="timer" checked>
          <label class="btn btn-outline-secondary" for="srcTimer">Timer 기록</label>
          <input type="radio" class="btn-check" name="source" id="srcPlan" value="plan">
          <label class="btn btn-outline-secondary" for="srcPlan">계획 체크</label>
        </div>
      </div>
    </header>

    <!-- 올해 전체 -->
    <section class="row g-3 mb-4" aria-label="올해 요약">
      <div class="col-6 col-lg-3"><div class="card h-100"><div class="card-body">
        <div class="sd-stat-label">올해 공부</div>
        <div class="sd-stat-value" id="statTotal">0</div>
      </div></div></div>
      <div class="col-6 col-lg-3"><div class="card h-100"><div class="card-body">
        <div class="sd-stat-label">공부한 날</div>
        <div class="sd-stat-value" id="statDays">0</div>
      </div></div></div>
      <div class="col-6 col-lg-3"><div class="card h-100"><div class="card-body">
        <div class="sd-stat-label">연속 공부</div>
        <div class="sd-stat-value" id="statStreak">0</div>
        <div class="sd-stat-note" id="statBest"></div>
      </div></div></div>
      <div class="col-6 col-lg-3"><div class="card h-100"><div class="card-body">
        <div class="sd-stat-label">가장 많이 한 과목</div>
        <div class="sd-stat-value sd-stat-text text-truncate" id="statTop">–</div>
        <div class="sd-stat-note" id="statTopNote"></div>
      </div></div></div>
    </section>

    <p class="sd-source-note small text-secondary mb-3" id="sourceNote"></p>

    <!-- 과목별 잔디 -->
    <div class="d-grid gap-3" id="heatmaps"></div>

    <div class="sd-heat-legend mt-3" aria-hidden="true">
      <span>적음</span><i class="lv0"></i><i class="lv1"></i><i class="lv2"></i><i class="lv3"></i><i class="lv4"></i><span>많음</span>
      <span class="ms-3" id="legendScale"></span>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="js/storage.js" defer></script>
  <script src="js/stats.js" defer></script>
  <script src="js/dashboard.js" defer></script>
</body>
</html>
